name: staffcheck_app
description: "A new Flutter project for StaffCheck with Games, Music, Location and Weather"
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  http: ^1.2.0
  flutter_map: ^6.1.0
  latlong2: ^0.9.0
  provider: ^6.1.2
  google_fonts: ^6.2.1
  flutter_staggered_animations: ^1.1.1
  vector_math: ^2.1.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/
